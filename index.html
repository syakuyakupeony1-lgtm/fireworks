<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>花火大会</title>
<style>
:root{
  --glass:rgba(255,255,255,0.07);
  --glass-b:rgba(255,255,255,0.11);
  --gH:rgba(255,255,255,0.16);
  --act-bg:rgba(255,214,80,0.16);
  --act-bc:rgba(255,214,80,0.5);
  --act-c:#ffd650;
  --blur:blur(28px) saturate(200%);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  --fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#04040f}
canvas{display:block;width:100vw;height:100vh;touch-action:manipulation;cursor:crosshair}

/* ── HUD (top-left) ── */
#hud{
  position:fixed;top:18px;left:18px;z-index:20;
  display:flex;align-items:stretch;
  background:var(--glass);border:0.5px solid var(--glass-b);
  border-radius:16px;
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  overflow:hidden;
}
.hud-cell{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:10px 18px;
}
.hud-sep{width:0.5px;background:rgba(255,255,255,0.1);margin:10px 0}
.hud-v{font-family:var(--fd);font-size:17px;font-weight:700;letter-spacing:-.03em;color:#fff;line-height:1}
.hud-l{font-family:var(--f);font-size:9px;font-weight:500;letter-spacing:.08em;
        text-transform:uppercase;color:rgba(255,255,255,.38)}

/* 接続ステータスセル */
#connCell{cursor:pointer;transition:background .2s;min-width:72px}
#connCell:hover{background:rgba(255,255,255,.07)}
#connDot{display:inline-block;width:6px;height:6px;border-radius:50%;
         background:rgba(255,255,255,.25);margin-right:5px;
         vertical-align:middle;transition:background .4s}
#connCell.live #connDot{background:#3de877;box-shadow:0 0 6px #3de877}
#connCell.solo #connDot{background:rgba(255,255,255,.3)}
#connCell.full #connDot{background:#ff6b4a;box-shadow:0 0 6px #ff6b4a}
#connLabel{font-family:var(--fd);font-size:13px;font-weight:600;
           color:rgba(255,255,255,.55);letter-spacing:.01em;line-height:1}
#connCell.live #connLabel{color:#3de877}
#connCell.full #connLabel{color:#ff6b4a}

/* ── Shot counter (top-right) ── */
#counter{
  position:fixed;top:20px;right:20px;z-index:20;
  font-family:var(--fd);font-size:13px;font-weight:500;letter-spacing:.02em;
  color:rgba(255,255,255,.32);pointer-events:none;transition:color .4s;
}
#counter.pop{color:rgba(255,214,80,.9);animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}

/* ── Bottom bar ── */
#bar{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  z-index:20;display:flex;flex-direction:column;align-items:center;gap:10px;
  pointer-events:auto;
}
#chips{
  display:flex;gap:5px;padding:7px 11px;
  background:var(--glass);border:0.5px solid var(--glass-b);
  border-radius:999px;
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;
}
#chips::-webkit-scrollbar{display:none}
.chip{
  font-family:var(--f);font-size:12px;font-weight:500;
  color:rgba(255,255,255,.55);background:transparent;
  border:0.5px solid transparent;border-radius:9px;
  padding:5px 11px;cursor:pointer;white-space:nowrap;user-select:none;
  transition:color .2s,background .2s,border-color .2s;
}
.chip:hover{color:rgba(255,255,255,.9);background:var(--gH)}
.chip.active{color:var(--act-c);background:var(--act-bg);border-color:var(--act-bc)}

#controls{
  display:flex;align-items:center;gap:6px;padding:7px 14px;
  background:var(--glass);border:0.5px solid var(--glass-b);
  border-radius:999px;
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
}
.cb{
  display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;
  border:0.5px solid transparent;background:transparent;cursor:pointer;
  transition:background .18s,border-color .18s;color:rgba(255,255,255,.65);
}
.cb:hover{background:var(--gH)}
.cb.active{background:var(--act-bg);border-color:var(--act-bc);color:var(--act-c)}
.cb svg{width:16px;height:16px;fill:currentColor}
.cdiv{width:0.5px;height:20px;background:rgba(255,255,255,.1);flex-shrink:0}

/* ソロ切り替えボタン */
#soloBtn{
  font-family:var(--f);font-size:11px;font-weight:600;
  letter-spacing:.04em;padding:0 11px;height:34px;border-radius:17px;
  border:0.5px solid transparent;background:transparent;cursor:pointer;
  color:rgba(255,255,255,.5);transition:all .18s;white-space:nowrap;
}
#soloBtn:hover{background:var(--gH);color:rgba(255,255,255,.9)}
#soloBtn.solo-on{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.85)}

#vol{
  -webkit-appearance:none;appearance:none;
  width:68px;height:3px;border-radius:2px;
  background:rgba(255,255,255,.18);outline:none;cursor:pointer;
}
#vol::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
  border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 1px 4px rgba(0,0,0,.4)}
#vol::-moz-range-thumb{width:13px;height:13px;border-radius:50%;
  background:rgba(255,255,255,.9);border:none;box-shadow:0 1px 4px rgba(0,0,0,.4)}

/* ── Hint ── */
#hint{
  position:fixed;bottom:130px;left:50%;transform:translateX(-50%);
  font-family:var(--f);font-size:13px;color:rgba(255,255,255,.3);
  pointer-events:none;white-space:nowrap;transition:opacity 1.2s;
}
#hint.gone{opacity:0}

/* ── 観覧バナー ── */
#viewBanner{
  position:fixed;bottom:120px;left:50%;transform:translateX(-50%);z-index:20;
  font-family:var(--f);font-size:12px;font-weight:500;
  color:rgba(255,170,50,.9);letter-spacing:.03em;
  background:rgba(255,160,40,.1);border:0.5px solid rgba(255,160,40,.28);
  padding:6px 16px;border-radius:999px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  pointer-events:none;display:none;
}
#viewBanner.show{display:block}

/* ── 満員オーバーレイ ── */
#fullOverlay{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;
  background:rgba(4,4,15,.85);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  opacity:0;pointer-events:none;transition:opacity .5s;
}
#fullOverlay.show{opacity:1;pointer-events:auto}
#fullTitle{font-family:var(--fd);font-size:clamp(24px,5vw,34px);font-weight:700;color:#fff;letter-spacing:-.02em}
#fullSub{font-family:var(--f);font-size:14px;color:rgba(255,255,255,.45);text-align:center;line-height:1.65;max-width:260px}
#fullCap{font-family:var(--f);font-size:12px;font-weight:600;color:rgba(255,180,60,.7);letter-spacing:.06em}
#fullWatch{
  margin-top:6px;padding:12px 30px;
  font-family:var(--f);font-size:15px;font-weight:600;
  color:#fff;background:rgba(255,255,255,.1);
  border:0.5px solid rgba(255,255,255,.2);border-radius:999px;cursor:pointer;
  backdrop-filter:blur(8px);transition:background .2s;
}
#fullWatch:hover{background:rgba(255,255,255,.18)}

/* ── マイルストーン ── */
#ms{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  pointer-events:none;z-index:30;opacity:0;
}
#ms.show{animation:msf 4.5s cubic-bezier(.22,1,.36,1) forwards}
@keyframes msf{
  0%{opacity:0;transform:scale(.82)} 10%{opacity:1;transform:scale(1)}
  75%{opacity:1;transform:scale(1)}  100%{opacity:0;transform:scale(1.06)}
}
#msN{
  font-family:var(--fd);font-size:clamp(80px,18vw,160px);font-weight:700;
  letter-spacing:-.04em;line-height:1;
  background:linear-gradient(145deg,#fff 20%,#ffd650 60%,#ff9d00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 40px rgba(255,200,60,.5));
}
#msL{
  margin-top:8px;font-family:var(--f);
  font-size:clamp(14px,3vw,20px);font-weight:500;
  letter-spacing:.15em;color:rgba(255,255,255,.5);
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<!-- HUD -->
<div id="hud">
  <div class="hud-cell">
    <span class="hud-v" id="sOnline">—</span>
    <span class="hud-l">参加中</span>
  </div>
  <div class="hud-sep"></div>
  <div class="hud-cell">
    <span class="hud-v" id="sVisitors">—</span>
    <span class="hud-l">のべ参加</span>
  </div>
  <div class="hud-sep"></div>
  <div class="hud-cell">
    <span class="hud-v" id="sTotal">—</span>
    <span class="hud-l">累計発数</span>
  </div>
  <div class="hud-sep"></div>
  <div class="hud-cell" id="connCell" title="クリックでソロ/ライブ切り替え">
    <span style="line-height:1;display:flex;align-items:center">
      <span id="connDot"></span>
      <span id="connLabel">接続中</span>
    </span>
    <span class="hud-l" id="connSub">タップで切替</span>
  </div>
</div>

<div id="counter">0 発</div>

<div id="bar">
  <div id="chips"></div>
  <div id="controls">
    <button class="cb active" id="muteBtn">
      <svg id="sIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    </button>
    <div class="cdiv"></div>
    <input type="range" id="vol" min="0" max="100" value="70">
    <div class="cdiv"></div>
    <button class="cb active" id="autoBtn">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
    </button>
    <div class="cdiv" id="soloDivider" style="display:none"></div>
    <button id="soloBtn" style="display:none">ソロ</button>
  </div>
</div>

<div id="hint">空をタップ → 花火 ／ 海をタップ → 噴水</div>
<div id="viewBanner">👁 観覧モード — 満員のため打ち上げはできません</div>
<div id="ms"><div id="msN">50</div><div id="msL">SHOTS</div></div>

<div id="fullOverlay">
  <div id="fullTitle">只今満員です</div>
  <div id="fullSub">現在 <span id="fullNow">100</span> 人が参加中です。<br>観覧モードで花火をお楽しみください。</div>
  <div id="fullCap">定員 100 名</div>
  <button id="fullWatch">観覧モードで入場</button>
</div>

<script>
"use strict";

/* ================================================================
 * Supabase 設定
 * ================================================================ */
const SB_URL = "https://hlptfaqdzpftzjqwnwqs.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhscHRmYXFkenBmdHpqcXdud3FzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDA2ODgsImV4cCI6MjA5Njc3NjY4OH0.UoEuR2KOlKnforcApsioElvTGQmF98Q3sF2W_nfnUeU";
const CAPACITY = 100;

/* ================================================================
 * Sound Engine
 * ================================================================ */
const Sfx = (() => {
  let A=null,master=null,verb=null,vSend=null,nBuf=null,satCurve=null;
  let muted=false,vol=0.7;
  function boot(){
    if(A)return A;
    A=new(window.AudioContext||window.webkitAudioContext)();
    master=A.createGain();master.gain.value=muted?0:vol;
    const lim=A.createDynamicsCompressor();
    lim.threshold.value=-12;lim.knee.value=8;lim.ratio.value=14;
    lim.attack.value=0.002;lim.release.value=0.3;
    master.connect(lim);lim.connect(A.destination);
    verb=A.createConvolver();
    const len=A.sampleRate*2.4,ir=A.createBuffer(2,len,A.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);}
    verb.buffer=ir;vSend=A.createGain();vSend.gain.value=0.38;
    vSend.connect(verb);verb.connect(master);
    return A;
  }
  function applyGain(){if(master)master.gain.setTargetAtTime(muted?0:vol,A.currentTime,0.02)}
  function noise(){if(!nBuf){const l=A.sampleRate*2;nBuf=A.createBuffer(1,l,A.sampleRate);const d=nBuf.getChannelData(0);for(let i=0;i<l;i++)d[i]=Math.random()*2-1;}return nBuf;}
  function sat(){const ws=A.createWaveShaper();if(!satCurve){satCurve=new Float32Array(1024);for(let i=0;i<1024;i++)satCurve[i]=Math.tanh((i/511.5-1)*3);}ws.curve=satCurve;return ws;}
  function route(x){const mix=A.createGain();mix.gain.value=1;const pan=A.createStereoPanner?A.createStereoPanner():null;if(pan){pan.pan.value=Math.max(-.8,Math.min(.8,(x/W)*1.6-.8));mix.connect(pan);pan.connect(master);pan.connect(vSend);}else{mix.connect(master);mix.connect(vSend);}return mix;}
  /* ── 混雑制御: 同時発音数に応じて1発あたりの音量を自動で下げる ── */
  let whisN=0,ftnN=0,boomT=[];
  function boomDensity(){const now=A.currentTime;while(boomT.length&&now-boomT[0]>1.2)boomT.shift();return boomT.length;}
  function whistle(dur,x){
    if(muted)return()=>{};
    const ac=boot();
    if(whisN>=5)return()=>{};          // 同時5本まで(超過分は省略)
    whisN++;const wk=1/Math.sqrt(whisN);
    const t0=ac.currentTime,mx=route(x);
    const osc=ac.createOscillator();osc.type="triangle";
    osc.frequency.setValueAtTime(2300,t0);osc.frequency.exponentialRampToValueAtTime(550,t0+dur);
    const vib=ac.createOscillator();vib.type="sine";
    vib.frequency.setValueAtTime(19,t0);vib.frequency.linearRampToValueAtTime(8,t0+dur);
    const vG=ac.createGain();vG.gain.value=70;vib.connect(vG);vG.connect(osc.frequency);
    const oG=ac.createGain();
    oG.gain.setValueAtTime(.0001,t0);oG.gain.exponentialRampToValueAtTime(.1*wk,t0+.12);
    oG.gain.setValueAtTime(.1*wk,t0+dur*.7);oG.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    const ns=ac.createBufferSource();ns.buffer=noise();ns.loop=true;
    const bp=ac.createBiquadFilter();bp.type="bandpass";bp.Q.value=1.2;
    bp.frequency.setValueAtTime(3200,t0);bp.frequency.exponentialRampToValueAtTime(800,t0+dur);
    const nG=ac.createGain();
    nG.gain.setValueAtTime(.0001,t0);nG.gain.exponentialRampToValueAtTime(.045*wk,t0+.2);
    nG.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    osc.connect(oG);oG.connect(mx);ns.connect(bp);bp.connect(nG);nG.connect(mx);
    osc.start(t0);vib.start(t0);ns.start(t0);
    const te=t0+dur+.1;osc.stop(te);vib.stop(te);ns.stop(te);
    osc.onended=()=>{whisN=Math.max(0,whisN-1);};
    return()=>{const n=ac.currentTime;oG.gain.cancelScheduledValues(n);nG.gain.cancelScheduledValues(n);oG.gain.setTargetAtTime(.0001,n,.03);nG.gain.setTargetAtTime(.0001,n,.03);};
  }
  function boom(sz=1,x){
    if(muted)return;
    const ac=boot(),k=boomDensity();
    if(k>=9)return;                    // 直近1.2秒で9発を超えたら省略
    boomT.push(ac.currentTime);
    const dk=1/Math.sqrt(1+k*.75);     // 混雑時ダッキング
    const t0=ac.currentTime+(k?Math.random()*.07:0); // 破裂音の時間をずらして濁り防止
    const mx=route(x);
    const a=ac.createBufferSource();a.buffer=noise();
    const ah=ac.createBiquadFilter();ah.type="highpass";ah.frequency.value=1500;
    const aG=ac.createGain();aG.gain.setValueAtTime(.55*sz*dk,t0);aG.gain.exponentialRampToValueAtTime(.0001,t0+.06);
    a.connect(ah);ah.connect(aG);aG.connect(mx);a.start(t0);a.stop(t0+.08);
    const sub=ac.createOscillator();sub.type="sine";
    sub.frequency.setValueAtTime(110/sz,t0);sub.frequency.exponentialRampToValueAtTime(28,t0+.5*sz);
    const sG=ac.createGain();sG.gain.setValueAtTime(1.0*sz*dk,t0);sG.gain.exponentialRampToValueAtTime(.0001,t0+1.1*sz);
    sub.connect(sG);sG.connect(mx);sub.start(t0);sub.stop(t0+1.2*sz);
    const bd=ac.createBufferSource();bd.buffer=noise();const sv=sat();
    const lp=ac.createBiquadFilter();lp.type="lowpass";
    lp.frequency.setValueAtTime(5500,t0);lp.frequency.exponentialRampToValueAtTime(120,t0+.8*sz);
    const bG=ac.createGain();bG.gain.setValueAtTime(.85*sz*dk,t0);bG.gain.exponentialRampToValueAtTime(.0001,t0+.9*sz);
    bd.connect(sv);sv.connect(lp);lp.connect(bG);bG.connect(mx);bd.start(t0);bd.stop(t0+sz);
    if(k<5){ // 余韻は空いている時だけ重ねる(低域の飽和防止)
      const ru=ac.createBufferSource();ru.buffer=noise();ru.loop=true;
      const rl=ac.createBiquadFilter();rl.type="lowpass";rl.frequency.value=110;
      const rG=ac.createGain();
      rG.gain.setValueAtTime(.0001,t0);rG.gain.exponentialRampToValueAtTime(.32*sz*dk,t0+.1);
      rG.gain.exponentialRampToValueAtTime(.0001,t0+2.2*sz);
      ru.connect(rl);rl.connect(rG);rG.connect(mx);ru.start(t0);ru.stop(t0+2.4*sz);
    }
  }
  function crackle(sz=1,x){
    if(muted)return;
    const ac=boot(),k=boomDensity();
    if(k>=7)return;
    const ck=1/(1+k*.5),mx=route(x),n=Math.floor((8+Math.random()*10*sz)*ck);
    for(let i=0;i<n;i++){
      const t=ac.currentTime+.15+Math.random()*1.4*sz;
      const p=ac.createBufferSource();p.buffer=noise();
      const hp=ac.createBiquadFilter();hp.type="highpass";hp.frequency.value=3000+Math.random()*5000;
      const g=ac.createGain();g.gain.setValueAtTime((.05+Math.random()*.07)*ck,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);
      p.connect(hp);hp.connect(g);g.connect(mx);p.start(t);p.stop(t+.06);
    }
  }
  function fountain(dur,x){
    if(muted)return()=>{};
    const ac=boot();ftnN++;
    const fk=.18/Math.sqrt(ftnN);
    const t0=ac.currentTime,mx=route(x);
    const ns=ac.createBufferSource();ns.buffer=noise();ns.loop=true;
    const bp=ac.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1300;bp.Q.value=0.8;
    const lfo=ac.createOscillator();lfo.frequency.value=3.5;
    const lG=ac.createGain();lG.gain.value=380;lfo.connect(lG);lG.connect(bp.frequency);
    const g=ac.createGain();
    g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(fk,t0+.3);
    g.gain.setValueAtTime(fk,t0+dur-.5);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    ns.connect(bp);bp.connect(g);g.connect(mx);ns.start(t0);lfo.start(t0);
    ns.stop(t0+dur+.1);lfo.stop(t0+dur+.1);
    ns.onended=()=>{ftnN=Math.max(0,ftnN-1);};
    return()=>{const n=ac.currentTime;g.gain.cancelScheduledValues(n);g.gain.setTargetAtTime(.0001,n,.1);};
  }
  return{
    unlock:boot,whistle,boom,crackle,fountain,
    setMuted(m){muted=m;if(A)applyGain()},
    setVol(v){vol=v;if(A)applyGain()},
    get muted(){return muted},
  };
})();

/* ================================================================
 * Canvas
 * ================================================================ */
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const fx=document.createElement("canvas"),fxc=fx.getContext("2d");
let W,H,DPR,HZ,stars=[],gradC={};
const R=(a,b)=>a+Math.random()*(b-a);
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;HZ=Math.round(H*.742);
  [canvas,fx].forEach(c=>{c.width=W*DPR;c.height=H*DPR;});
  ctx.setTransform(DPR,0,0,DPR,0,0);fxc.setTransform(DPR,0,0,DPR,0,0);gradC={};
  stars=[];const n=Math.floor(W*HZ/8000);
  for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*HZ*.94,r:Math.random()<.85?R(.35,.85):R(.9,1.7),ph:Math.random()*Math.PI*2,sp:R(.3,1.5)});
}
window.addEventListener("resize",resize);resize();

/* ================================================================
 * Entities
 * ================================================================ */
const rockets=[],particles=[],flashes=[],fountainObjs=[],ripples=[];
const MAX_P=5200,GRAVITY=0.06;
const COLORS=[["#ff5252","#ffd180"],["#69f0ae","#b9f6ca"],["#40c4ff","#80d8ff"],["#ffd740","#ffff8d"],["#ff4081","#ff80ab"],["#e040fb","#ea80fc"],["#fff","#b3e5fc"]];
const TYPES_K=["peony","chrys","willow","ring","heart","senrin","change"];

class Ripple{
  constructor(x,color){this.x=x;this.r=2;this.life=1;this.spd=R(14,26);this.color=color||"rgba(180,200,255,.6)";}
  update(dt){this.r+=this.spd*dt;this.life-=1.7*dt;return this.life>0;}
  draw(){ctx.globalAlpha=this.life*.5;ctx.strokeStyle=this.color;ctx.lineWidth=1+this.life;ctx.beginPath();ctx.ellipse(this.x,HZ,this.r*2.8,this.r*.45,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;}
}

class Particle{
  constructor(x,y,vx,vy,color,sz,o={}){
    this.x=x;this.y=y;this.px=x;this.py=y;this.vx=vx;this.vy=vy;
    this.color=color;this.color2=o.color2||null;this.life=1;
    this.decay=R(.45,.85)/sz*(o.dm||1);this.r=o.r||R(1.2,2.4);
    this.twinkle=o.twinkle!==undefined?o.twinkle:Math.random()<.3;
    this.drag=o.drag||.985;this.grav=o.grav!==undefined?o.grav:.035;
    this.trail=o.trail||false;this.child=o.child||false;
  }
  update(dt){
    this.px=this.x;this.py=this.y;this.vx*=this.drag;
    this.vy=this.vy*this.drag+this.grav*dt*60;
    this.x+=this.vx*dt*60;this.y+=this.vy*dt*60;
    if(this.y>=HZ){if(this.life>.2)ripples.push(new Ripple(this.x,this.color));return false;}
    this.life-=this.decay*dt;
    if(this.life<=0){if(this.child)miniBurst(this.x,this.y,this.color);return false;}
    return true;
  }
  draw(){
    const a=this.twinkle&&Math.random()<.25?this.life*.3:this.life;
    fxc.globalAlpha=Math.max(a,0);
    const col=this.color2&&this.life<.55?this.color2:this.color;
    if(this.trail){fxc.strokeStyle=col;fxc.lineWidth=Math.max(this.r*this.life,.3);fxc.lineCap="round";fxc.beginPath();fxc.moveTo(this.px,this.py);fxc.lineTo(this.x,this.y);fxc.stroke();}
    else{fxc.fillStyle=col;fxc.beginPath();fxc.arc(this.x,this.y,this.r*this.life,0,Math.PI*2);fxc.fill();}
  }
}
function addP(p){if(particles.length<MAX_P)particles.push(p);}
function miniBurst(x,y,color){
  Sfx.crackle(.5,x);
  for(let i=0;i<10;i++){const a=(Math.PI*2*i)/10+R(-.2,.2),v=R(.8,1.8)*(H/800);addP(new Particle(x,y,Math.cos(a)*v,Math.sin(a)*v,color,.6,{dm:1.4,twinkle:true,r:1.4}));}
}

class Fountain{
  constructor(x,dur=4.5){this.x=x;this.t=0;this.dur=dur;this.cols=Math.random()<.7?["#ffd180","#ffe9b8","#ffab40"]:["#b9f6ca","#e8fff1","#69f0ae"];this.stopSnd=Sfx.fountain(dur,x);}
  update(dt){
    this.t+=dt;if(this.t>=this.dur){this.stopSnd();return false;}
    const env=Math.min(this.t/.5,1)*Math.min((this.dur-this.t)/.6,1),n=Math.round(6*env)+1;
    for(let i=0;i<n;i++){
      const v=R(3.2,7.5)*(H/800)*(0.5+env*.5),a=-Math.PI/2+R(-.22,.22);
      addP(new Particle(this.x+R(-2,2),HZ-1,Math.cos(a)*v,Math.sin(a)*v,this.cols[(Math.random()*this.cols.length)|0],.8,{trail:true,drag:.99,grav:.05,dm:R(1.2,2.2),twinkle:true,r:R(.8,1.8)}));
    }
    return true;
  }
}

class Rocket{
  constructor(tx,ty,scatter=0,type="random",sz){
    this.type=type==="random"?TYPES_K[(Math.random()*TYPES_K.length)|0]:type;
    this.x=tx+R(-scatter,scatter);this.y=HZ+3;this.targetY=Math.min(ty,HZ-60);this.sz=sz||R(.7,1.5);
    const h=this.y-this.targetY;this.vy=-Math.sqrt(2*GRAVITY*Math.max(h,40));this.vx=0;
    this.colors=COLORS[(Math.random()*COLORS.length)|0];this.trail=[];
    this.flightTime=(-this.vy/GRAVITY)/60;this.stopW=Sfx.whistle(this.flightTime,this.x);
  }
  update(dt){
    this.trail.push({x:this.x,y:this.y,life:1});if(this.trail.length>20)this.trail.shift();
    for(const t of this.trail)t.life-=dt*3;
    this.vy+=GRAVITY*dt*60;this.x+=this.vx*dt*60;this.y+=this.vy*dt*60;
    if(this.y<=this.targetY||this.vy>=-.3){this.explode();return false;}return true;
  }
  explode(){
    this.stopW();Sfx.boom(this.sz,this.x);
    if(this.type!=="willow")Sfx.crackle(this.sz,this.x);
    const[c1,c2]=this.colors,spd=(2.6+1.9*this.sz)*(H/800);
    const push=(vx,vy,col,o)=>addP(new Particle(this.x,this.y,vx,vy,col,this.sz,o));
    switch(this.type){
      case"chrys":{const n=Math.floor(90+70*this.sz);for(let i=0;i<n;i++){const a=(Math.PI*2*i)/n+R(-.04,.04),v=spd*(.6+Math.random()*.4);push(Math.cos(a)*v,Math.sin(a)*v,Math.random()<.7?c1:c2,{trail:true,drag:.98});}break;}
      case"willow":{const n=Math.floor(100+70*this.sz);for(let i=0;i<n;i++){const a=(Math.PI*2*i)/n+R(-.1,.1),v=spd*.75*(.5+Math.random()*.5);push(Math.cos(a)*v,Math.sin(a)*v,Math.random()<.85?"#ffd180":"#ffab40",{trail:true,drag:.97,grav:.020,dm:.43,twinkle:false});}break;}
      case"ring":{const n=Math.floor(55+35*this.sz),tilt=R(.35,1),rot=R(0,Math.PI);for(let i=0;i<n;i++){const a=(Math.PI*2*i)/n,ex=Math.cos(a)*spd,ey=Math.sin(a)*spd*tilt;push(ex*Math.cos(rot)-ey*Math.sin(rot),ex*Math.sin(rot)+ey*Math.cos(rot),c1,{dm:.9});}break;}
      case"heart":{const n=Math.floor(65+35*this.sz);for(let i=0;i<n;i++){const a=(Math.PI*2*i)/n,hx=16*Math.pow(Math.sin(a),3),hy=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));push(hx*(spd/16)*R(.95,1.05),hy*(spd/16)*R(.95,1.05),Math.random()<.8?"#ff4081":"#ff80ab",{drag:.99,grav:.02,dm:.8});}break;}
      case"senrin":{const n=Math.floor(15+9*this.sz);for(let i=0;i<n;i++){const a=(Math.PI*2*i)/n+R(-.1,.1),v=spd*.8*(.6+Math.random()*.4);push(Math.cos(a)*v,Math.sin(a)*v,c1,{child:true,dm:1.3,r:2.4,twinkle:false});}break;}
      case"change":{const n=Math.floor(80+70*this.sz),alt=COLORS[(Math.random()*COLORS.length)|0][0];for(let i=0;i<n;i++){const a=(Math.PI*2*i)/n+R(-.05,.05),v=spd*(.55+Math.random()*.45);push(Math.cos(a)*v,Math.sin(a)*v,c1,{color2:alt,dm:.8});}break;}
      default:{const n=Math.floor(80+70*this.sz);for(let i=0;i<n;i++){const a=(Math.PI*2*i)/n+R(-.05,.05),v=spd*(.55+Math.random()*.45);push(Math.cos(a)*v,Math.sin(a)*v,Math.random()<.7?c1:c2,{});}}
    }
    flashes.push({x:this.x,y:this.y,r:34*this.sz,life:1});
  }
  draw(){
    for(let i=0;i<this.trail.length;i++){const t=this.trail[i];if(t.life<=0)continue;fxc.globalAlpha=t.life*.5;fxc.fillStyle="#ffcf8a";fxc.beginPath();fxc.arc(t.x,t.y,1.2*(i/this.trail.length)+.4,0,Math.PI*2);fxc.fill();}
    fxc.globalAlpha=1;fxc.fillStyle="#fff4d6";fxc.beginPath();fxc.arc(this.x,this.y,2.2,0,Math.PI*2);fxc.fill();
  }
}

/* ================================================================
 * Background / Sea / Reflection
 * ================================================================ */
function drawBg(time){
  if(!gradC.sky||gradC.h!==H){const g=ctx.createLinearGradient(0,0,0,HZ);g.addColorStop(0,"#03030d");g.addColorStop(.65,"#09091f");g.addColorStop(1,"#131330");gradC.sky=g;gradC.h=H;}
  ctx.fillStyle=gradC.sky;ctx.fillRect(0,0,W,HZ);
  for(const s of stars){const tw=.3+.5*(0.5+0.5*Math.sin(time*s.sp+s.ph));ctx.globalAlpha=tw;ctx.fillStyle="#cdd6ff";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
}
function drawSea(){
  if(!gradC.sea||gradC.hh!==H){const g=ctx.createLinearGradient(0,HZ,0,H);g.addColorStop(0,"#0f1228");g.addColorStop(.45,"#0a0b1c");g.addColorStop(1,"#050510");gradC.sea=g;gradC.hh=H;}
  ctx.fillStyle=gradC.sea;ctx.fillRect(0,HZ,W,H-HZ);
}
function drawReflection(time){
  const seaH=H-HZ;ctx.save();ctx.globalCompositeOperation="lighter";
  for(let y=HZ;y<H;y+=3){
    const depth=(y-HZ)/seaH,srcY=HZ-(y-HZ)*.9-3;
    if(srcY<0)continue;
    const sway=Math.sin(y*.055+time*1.6)*(2+depth*10)+Math.sin(y*.013-time*.75)*(1.5+depth*5)+Math.sin(y*.12+time*2.3)*(depth*2);
    ctx.globalAlpha=(.52*Math.pow(1-depth,1.1)+.04)*.8;
    ctx.drawImage(fx,0,srcY*DPR,fx.width,3*DPR,sway,y,W,3);
  }
  ctx.restore();ctx.globalAlpha=1;
}
function drawSeaSurface(time){
  const seaH=H-HZ;ctx.globalCompositeOperation="lighter";
  const hl=ctx.createLinearGradient(0,HZ-10,0,HZ+16);
  hl.addColorStop(0,"rgba(100,120,200,0)");hl.addColorStop(.5,"rgba(140,160,255,.1)");hl.addColorStop(1,"rgba(100,120,200,0)");
  ctx.fillStyle=hl;ctx.fillRect(0,HZ-10,W,26);
  for(let i=0;i<14;i++){
    const ph=i*2.39996,yy=HZ+8+((Math.sin(time*.21+ph)*.5+.5)**1.6)*(seaH-18),xx=(ph*997+time*(5+i*2.5))%(W+180)-90,len=28+(yy-HZ)*.85,a=(.048*(1-(yy-HZ)/seaH)+.01);
    const wg=ctx.createLinearGradient(xx-len,yy,xx+len,yy);
    wg.addColorStop(0,"rgba(170,195,255,0)");wg.addColorStop(.5,`rgba(195,215,255,${(a*3).toFixed(3)})`);wg.addColorStop(1,"rgba(170,195,255,0)");
    ctx.strokeStyle=wg;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(xx-len,yy);ctx.lineTo(xx+len,yy);ctx.stroke();
  }
  ctx.globalCompositeOperation="source-over";
  for(const r of ripples)r.draw();
}

/* ================================================================
 * Main loop
 * ================================================================ */
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;const time=now/1000;
  fxc.globalCompositeOperation="destination-out";fxc.globalAlpha=1;fxc.fillStyle="rgba(0,0,0,.22)";fxc.fillRect(0,0,W,H);
  fxc.globalCompositeOperation="lighter";
  for(let i=fountainObjs.length-1;i>=0;i--)if(!fountainObjs[i].update(dt))fountainObjs.splice(i,1);
  for(let i=rockets.length-1;i>=0;i--){if(!rockets[i].update(dt))rockets.splice(i,1);else rockets[i].draw();}
  for(let i=particles.length-1;i>=0;i--){if(!particles[i].update(dt))particles.splice(i,1);else particles[i].draw();}
  for(let i=flashes.length-1;i>=0;i--){
    const f=flashes[i];f.life-=dt*5;if(f.life<=0){flashes.splice(i,1);continue;}
    fxc.globalAlpha=f.life*.6;const g=fxc.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*(2-f.life));
    g.addColorStop(0,"rgba(255,255,255,.9)");g.addColorStop(1,"rgba(255,255,255,0)");
    fxc.fillStyle=g;fxc.beginPath();fxc.arc(f.x,f.y,f.r*(2-f.life),0,Math.PI*2);fxc.fill();
  }
  fxc.globalCompositeOperation="source-over";fxc.globalAlpha=1;
  for(let i=ripples.length-1;i>=0;i--)if(!ripples[i].update(dt))ripples.splice(i,1);
  drawBg(time);
  ctx.globalCompositeOperation="lighter";ctx.drawImage(fx,0,0,fx.width,fx.height,0,0,W,H);
  ctx.globalCompositeOperation="source-over";
  drawSea();drawReflection(time);drawSeaSurface(time);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================================================================
 * Multiplayer — Supabase Broadcast + Presence + RPC
 * ================================================================ */
const uid=sessionStorage.getItem("fw_uid")||Math.random().toString(36).slice(2);
sessionStorage.setItem("fw_uid",uid);

let soloMode = false;   // ユーザーが手動でソロに切り替えた状態
let viewOnly = false;   // 満員で観覧のみ
let joined   = false;   // Presence に track 済み
let sbClient = null, sbChan = null;
let pendingTotal = 0;   // SDK ロード前に発生した発数

// 累計カウンターのローカルキャッシュ（楽観的更新）
let localTotal = parseInt(localStorage.getItem("fw_total") || "0");

const sTotalEl  = document.getElementById("sTotal");
const sOnlineEl = document.getElementById("sOnline");
const connCell  = document.getElementById("connCell");
const connLabel = document.getElementById("connLabel");
const connSub   = document.getElementById("connSub");
const soloBtn   = document.getElementById("soloBtn");
const soloDivider = document.getElementById("soloDivider");
const viewBanner = document.getElementById("viewBanner");

// ── 接続状態の表示を更新 ──
function setConnState(state){
  connCell.className="";
  if(state==="live"){
    connCell.classList.add("live");
    connLabel.textContent="ライブ";
    connSub.textContent="タップでソロ切替";
    soloBtn.textContent="ソロへ"; soloBtn.classList.remove("solo-on");
  } else if(state==="solo"){
    connCell.classList.add("solo");
    connLabel.textContent="ソロ";
    connSub.textContent="タップでライブ復帰";
    soloBtn.textContent="ライブへ"; soloBtn.classList.add("solo-on");
  } else if(state==="full"){
    connCell.classList.add("full");
    connLabel.textContent="満員";
    connSub.textContent="観覧モード";
  } else {
    connLabel.textContent="接続中";
    connSub.textContent="";
  }
}

// ── 参加者数 / 累計をセット ──
const sVisEl = document.getElementById("sVisitors");
function setOnline(n){ sOnlineEl.textContent = n==null ? "—" : String(n); }
function setVisitors(n){ sVisEl.textContent = n==null ? "—" : Number(n).toLocaleString(); }
function setTotal(n){
  localTotal = n;
  localStorage.setItem("fw_total", n);
  sTotalEl.textContent = n.toLocaleString();
}

// ── ソロ / ライブ 切り替え ──
function toggleSolo(){
  if(viewOnly) return;
  soloMode = !soloMode;
  if(soloMode){
    if(joined && sbChan){ sbChan.untrack(); joined=false; }
    setConnState("solo");
    setOnline(null);
  } else {
    if(sbChan && !joined){ sbChan.track({uid, t:Date.now()}); joined=true; }
    setConnState("live");
  }
}
connCell.addEventListener("click", toggleSolo);
soloBtn.addEventListener("click",  toggleSolo);

// ── 発数をインクリメント（必ずここを通す） ──
function incTotal(){
  localTotal++;
  setTotal(localTotal);
  if(!sbClient || soloMode){ return; }   // ソロ or SDK未ロード
  if(!joined){ pendingTotal++; return; } // まだ参加前
  sbClient.rpc("fw_increment");
}

// ── Supabase SDK をロードして接続 ──
if(SB_URL && SB_KEY){
  const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js";
  s.onload=()=>{
    sbClient = window.supabase.createClient(SB_URL, SB_KEY);

    // ① 累計初期値を取得（発数＋のべ参加者数）
    sbClient.from("fw_stats").select("key,value").in("key",["total","visitors"])
      .then(({data,error})=>{
        if(error || !data) return;
        for(const row of data){
          if(row.key==="total") setTotal(Number(row.value));
          if(row.key==="visitors") setVisitors(Number(row.value));
        }
      });

    // ② 累計のリアルタイム購読
    sbClient.channel("stats-watch")
      .on("postgres_changes",{event:"UPDATE",schema:"public",table:"fw_stats"},
        p=>{
          if(soloMode || !p.new) return;
          if(p.new.key==="total") setTotal(Number(p.new.value));
          if(p.new.key==="visitors") setVisitors(Number(p.new.value));
        })
      .subscribe();

    // ③ メインチャンネル（Presence + Broadcast）
    sbChan = sbClient.channel("fireworks-v2",{
      config:{
        presence:{ key: uid },
        broadcast:{ self: false },
      },
    });

    sbChan.on("presence",{event:"sync"},()=>{
      const state = sbChan.presenceState();
      const n = Object.keys(state).length;

      if(!soloMode) setOnline(Math.max(n, joined ? 1 : 0));

      // 初回: 定員チェックして入場
      if(!joined && !viewOnly && !soloMode){
        if(n >= CAPACITY){
          document.getElementById("fullNow").textContent = n;
          document.getElementById("fullOverlay").classList.add("show");
          return;
        }
        sbChan.track({uid, t: Date.now()});
        joined = true;
        setConnState("live");
        soloBtn.style.display="inline-flex";
        soloDivider.style.display="block";
        // 初参加のブラウザなら「のべ参加者数」を+1
        if(!localStorage.getItem("fw_seen")){
          localStorage.setItem("fw_seen","1");
          sbClient.rpc("fw_visit");
        }
        // ロード前に溜まった発数を一括送信
        if(pendingTotal > 0){
          for(let i=0;i<pendingTotal;i++) sbClient.rpc("fw_increment");
          pendingTotal = 0;
        }
      }
    });

    sbChan.on("broadcast",{event:"launch"},({payload:d})=>{
      if(!d || d.uid===uid || soloMode) return;
      const x=d.xr*W, y=d.yr*HZ;
      if(d.type==="fountain") fountainObjs.push(new Fountain(x));
      else rockets.push(new Rocket(x,y,0,d.type));
    });

    sbChan.subscribe();
  };
  document.head.appendChild(s);
} else {
  // Supabase 未設定 → ソロモード固定
  soloMode = true;
  setConnState("solo");
  setOnline(1);
  setTotal(localTotal);
}

// ── ブロードキャスト ──
function broadcast(x,y,type){
  if(!sbChan || !joined || soloMode || viewOnly) return;
  sbChan.send({type:"broadcast",event:"launch",payload:{xr:x/W,yr:y/HZ,type,uid}});
}

/* ================================================================
 * Shot counter & Milestone
 * ================================================================ */
let shotCount=0;
const counterEl=document.getElementById("counter");
const msEl=document.getElementById("ms"),msN=document.getElementById("msN");
let msTimer=null;

function incShot(){
  shotCount++;
  counterEl.textContent=`${shotCount} 発`;
  counterEl.classList.remove("pop");
  requestAnimationFrame(()=>counterEl.classList.add("pop"));
  incTotal();
  if(shotCount%50===0) milestone(shotCount);
}
function milestone(n){
  const lvl=Math.min(Math.floor(n/50),8); // 節目を重ねるほど豪華に
  // ① オープニング: 中央に超大玉
  rockets.push(new Rocket(W*.5,H*.11,0,"chrys",2.2));
  // ② スターマイン(速射連発) — 画面全幅に波状で
  const volley=14+lvl*3;
  for(let i=0;i<volley;i++){
    const sweep=(i/volley)*W*.88+W*.06; // 左→右へ流れる打ち上げ
    setTimeout(()=>rockets.push(new Rocket(sweep+R(-40,40),R(H*.10,H*.42),0,TYPES_K[(Math.random()*TYPES_K.length)|0],R(.8,1.5))),350+i*120);
  }
  // ③ 水際全面に噴水のカーテン
  const fc=Math.min(5+lvl,9);
  for(let i=0;i<fc;i++)setTimeout(()=>fountainObjs.push(new Fountain(W*(i+.5)/fc,5.5)),250+i*90);
  // ④ 大柳3連(しだれの幕)
  [W*.22,W*.5,W*.78].forEach((x,i)=>setTimeout(()=>rockets.push(new Rocket(x,H*.10,0,"willow",2.0)),2400+i*280));
  // ⑤ フィナーレ: 千輪の超大玉 + 両脇にハート
  setTimeout(()=>rockets.push(new Rocket(W*.5,H*.09,0,"senrin",2.4)),3600);
  setTimeout(()=>{rockets.push(new Rocket(W*.28,H*.18,0,"heart",1.6));rockets.push(new Rocket(W*.72,H*.18,0,"heart",1.6));},3900);
  msN.textContent=n;msEl.classList.remove("show");
  if(msTimer)clearTimeout(msTimer);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{msEl.classList.add("show");msTimer=setTimeout(()=>msEl.classList.remove("show"),4600);}));
}

/* ================================================================
 * 満員オーバーレイ
 * ================================================================ */
document.getElementById("fullWatch").addEventListener("click",()=>{
  viewOnly=true;
  document.getElementById("fullOverlay").classList.remove("show");
  viewBanner.classList.add("show");
  document.getElementById("bar").style.display="none";
  document.getElementById("hint").classList.add("gone");
  canvas.style.cursor="default";
  setConnState("full");
});

/* ================================================================
 * Type chips
 * ================================================================ */
const TYPES_UI=[
  {key:"random",label:"おまかせ"},{key:"peony",label:"牡丹"},
  {key:"chrys",label:"菊"},{key:"willow",label:"柳"},
  {key:"ring",label:"環"},{key:"heart",label:"ハート"},
  {key:"senrin",label:"千輪"},{key:"change",label:"色変化"},
  {key:"fountain",label:"噴水"},
];
let selType="random";
const chipsEl=document.getElementById("chips");
TYPES_UI.forEach(({key,label})=>{
  const el=document.createElement("button");
  el.className="chip"+(key==="random"?" active":"");
  el.textContent=label;
  el.addEventListener("click",()=>{
    selType=key;
    chipsEl.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
    el.classList.add("active");
  });
  chipsEl.appendChild(el);
});

/* ================================================================
 * Launch
 * ================================================================ */
function launch(x,y,scatter=0,typeOvr){
  Sfx.unlock();
  const type=typeOvr||selType;
  if(type==="fountain"){
    fountainObjs.push(new Fountain(x));
    incShot(); broadcast(x,y,"fountain"); return;
  }
  const ty=Math.min(Math.max(y,H*.05),HZ-60);
  rockets.push(new Rocket(x,ty,scatter,type));
  incShot(); broadcast(x,ty,type);
}

let hintGone=false;
canvas.addEventListener("pointerdown",e=>{
  if(viewOnly)return;
  Sfx.unlock();
  if(e.clientY>HZ&&selType==="random"){ fountainObjs.push(new Fountain(e.clientX));incShot();broadcast(e.clientX,e.clientY,"fountain");}
  else launch(e.clientX,e.clientY);
  if(!hintGone){document.getElementById("hint").classList.add("gone");hintGone=true;}
});

/* ================================================================
 * Auto show
 * ================================================================ */
let autoMode=true,autoTimer=0,cycleN=0;
setInterval(()=>{
  if(!autoMode||document.hidden)return;
  autoTimer-=.5;if(autoTimer>0)return;
  cycleN++;
  if(cycleN%9===0){
    const n=6,cx=R(W*.28,W*.72);
    for(let i=0;i<n;i++)setTimeout(()=>{rockets.push(new Rocket(cx+(i-(n-1)/2)*R(50,110),R(H*.09,H*.32),0,TYPES_K[(Math.random()*TYPES_K.length)|0]));incShot();},i*120);
    autoTimer=R(4,6.5);
  } else if(cycleN%13===0){
    fountainObjs.push(new Fountain(R(W*.15,W*.85)));incShot();autoTimer=R(2.5,4.5);
  } else {
    const burst=1+((Math.random()*3)|0);
    for(let i=0;i<burst;i++)setTimeout(()=>launch(R(W*.1,W*.9),R(H*.09,H*.44),30,"random"),i*R(150,420));
    autoTimer=R(1.5,4);
  }
},500);

/* ================================================================
 * UI controls
 * ================================================================ */
const muteBtn=document.getElementById("muteBtn"),sIcon=document.getElementById("sIcon");
const spkOn=`<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>`;
const spkOff=`<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>`;
muteBtn.addEventListener("click",()=>{const nm=!Sfx.muted;Sfx.setMuted(nm);muteBtn.classList.toggle("active",!nm);sIcon.innerHTML=nm?spkOff:spkOn;if(!nm)Sfx.unlock();});
document.getElementById("vol").addEventListener("input",e=>Sfx.setVol(e.target.value/100));
const autoBtn=document.getElementById("autoBtn");
autoBtn.addEventListener("click",()=>{autoMode=!autoMode;autoBtn.classList.toggle("active",autoMode);if(autoMode)Sfx.unlock();});
</script>
